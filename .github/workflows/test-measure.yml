name: Test and Measure

# Thin caller to rtCamp/wp-shared-workflows (scaffold: ci/test-measure).
# Single entry point that delegates lint (CSS/JS/PHP), JS tests, the PHP x WP
# test matrix, build, and the build-artifact gate to the wp-ci.yml
# orchestrator; every job there is gated on detected changes, so a docs-only
# PR runs almost nothing. Replaces the seven per-check ci-*.yml callers,
# which could express neither the test matrix nor private-repo tokens.
# Pinned at release/v1.0.0 during the private pilot; bump to a stable @v1 tag
# once the shared workflows are published.
# Source: https://github.com/rtCamp/wp-shared-workflows/blob/release/v1.0.0/.github/workflows/wp-ci.yml

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - master

permissions:
  contents: read

# Cancel previous in-flight runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: rtCamp/wp-shared-workflows/.github/workflows/wp-ci.yml@release/v1.0.0
    with:
      project-type: plugin
      php-versions: '["8.2", "8.3", "8.4"]'
      wp-versions: '["6.7", "6.8", "6.9", "7.0"]'
      test-php-exclude: '[]'
    secrets:
      # Single token with read access to the private rtCamp repos (wp-tooling
      # for change detection, wp-framework for composer install) while they
      # remain unpublished during the pilot.
      wp-tooling-token: ${{ secrets.WP_FRAMEWORK_REPO_TEMP_TOKEN }}
      packages-token: ${{ secrets.WP_FRAMEWORK_REPO_TEMP_TOKEN }}
