name: Feature request
description: Suggest a new capability, or an improvement to an existing one, for the skeleton.
type: Feature
labels:
  - "Type: Feature"
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the suggestion. Please search
        [existing issues](https://github.com/rtCamp/plugin-elementary/issues?q=is%3Aissue)
        first.
  - type: markdown
    attributes:
      value: >-
        Every plugin created from this skeleton copies it, so additions should
        be general enough for most projects. Framework behaviour belongs in
        [wp-primitives](https://github.com/rtCamp/wp-primitives), the init and
        scaffold engine in [wp-tooling](https://github.com/rtCamp/wp-tooling),
        and CI jobs in
        [wp-shared-workflows](https://github.com/rtCamp/wp-shared-workflows).
        [CONTRIBUTING.md](https://github.com/rtCamp/plugin-elementary/blob/main/CONTRIBUTING.md)
        explains how to build it yourself.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of request
      options:
        - Something new the skeleton does not do yet
        - An improvement to something it already does
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Init and capabilities (npm run init, bin/scaffold.config.js)"
        - "Modules and examples (inc/Modules/)"
        - "Core services (inc/Core/)"
        - "Blocks and assets (src/, webpack, HMR, Tailwind)"
        - "Tests and lint (PHPUnit, Jest, PHPCS, PHPStan, ESLint, Stylelint)"
        - "CI workflows"
        - "AI tooling (AGENTS.md, Claude skills, Copilot prompts)"
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the problem or missing capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the solution you'd like
      description: >-
        What the skeleton should ship, and whether it should be always on, a
        capability that init can remove, or an optional feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Workarounds you use now, or other designs you ruled out.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
