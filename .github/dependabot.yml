version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    labels:
      - Dependencies

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    versioning-strategy: increase
    groups:
      # Mixed releases install duplicate copies, which break the block tests.
      # @wordpress/theme follows @wordpress/stylelint-config's peer range instead.
      wordpress:
        patterns:
          - '@wordpress/*'
        exclude-patterns:
          - '@wordpress/theme'
      react:
        patterns:
          - react
          - react-dom
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
    labels:
      - Dependencies

  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    versioning-strategy: increase
    labels:
      - Dependencies
